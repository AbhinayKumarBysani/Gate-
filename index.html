function fmt(d){return d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function daysToExam(){return Math.ceil((date(db.settings.examDate)-new Date())/86400000)}
function targetSyllabusDate(){let d=date(db.settings.examDate);d.setMonth(d.getMonth()-Number(db.settings.bufferMonths));return d}
function getStartDate(){return new Date()}
function calcPlan(){
 const today=new Date(), target=targetSyllabusDate(), days=Math.max(1,Math.ceil((target-today)/86400000));
 const totalHours=topics.reduce((s,t)=>s+t.hours,0);
 const weeks=Math.max(1,days/7), weekly=Math.ceil(totalHours/weeks);
 return {today,target,days,totalHours,weeks,weekly};
}
function renderStats(){
 const n=topics.filter(t=>db.completed.includes(t.name)).length;
 $("#sideCountdown").textContent=daysToExam()>0?`${daysToExam()} days to target exam date`:"Exam date has passed — update settings";
 if($("#statTopics"))$("#statTopics").textContent=`${n} / ${topics.length}`;
 if($("#statHours"))$("#statHours").textContent=`${Number(db.hours).toFixed(1)} h`;
 if($("#statAccuracy")){let a=db.attempts;$("#statAccuracy").textContent=a.length?Math.round(a.filter(x=>x.correct).length/a.length*100)+"%":"—"}
 if($("#statCountdown"))$("#statCountdown").textContent=daysToExam()>0?daysToExam()+" days":"Update exam date";
 if($("#statScore"))$("#statScore").textContent=estimatedScore()+"/100";
}
function estimatedScore(){
 // transparent illustrative estimate from syllabus completion, quiz accuracy, and consistency; not an official score predictor
 let completion=topics.filter(t=>db.completed.includes(t.name)).length/topics.length;
 let attempts=db.attempts.length?db.attempts.filter(a=>a.correct).length/db.attempts.length:.25;
 let practice=Math.min(1,db.attempts.length/120);
 let hours=Math.min(1,Number(db.hours)/400);
 return Math.round(Math.min(100,100*(.4*completion+.25*attempts+.2*practice+.15*hours)));
}
function buttonPage(p,label,cls="btn ghost small"){return `<button class="${cls}" data-go="${p}">${label}</button>`}
function dailyMissionText(){
 const unresolved=(db.errors||[]).filter(e=>!e.resolved);
 if(unresolved.length) return `First priority: review ${unresolved[0].topic} — you have ${unresolved.length} unresolved mistake(s). Read the explanation, solve a similar problem, then mark the mistake reviewed.`;
 const next=topics.find(t=>!db.completed.includes(t.name));
 if(next) return `Next recommended topic: ${next.name} (${next.subject}). Spend 20 minutes learning the concept, 20 minutes solving fresh questions, and 5 minutes writing a summary from memory.`;
 return 'Your topic groups are marked complete. Shift focus to verified previous-year questions, mixed practice, spaced revision and timed mock tests.';
}

 class="card"><div class="list">${dynamicTopicOrder().map((t,i,order)=>{let locked=i>0&&!topicMastery(order[i-1].name), mastered=topicMastery(t.name);return `<article class="item"><div class="item-main"><b>${locked?"🔒 ":mastered?"✓ ":""}${t.name}</b><small>${t.subject} · ${t.priority} priority · ${t.difficulty} · ${topicAttempts(t.name).length} attempts · ${mastered?"Mastered":locked?"Previous topic required":"In progress"}</small><small>${esc(t.concept)}</small></div><button class="btn small ${locked?"alt":""}" data-concept="${esc(t.name)}">${locked?"Unlock after previous":"Study →"}</button></article>`}).join("")}</div></section>`);

function topicAttempts(name){return db.attempts.filter(a=>a.topic===name).slice(-5)}
function topicMastery(name){const a=topicAttempts(name).slice(-3);return a.length>=3 && a.filter(x=>x.correct).length>=2 && !!a[a.length-1].correct}
function recentPerformance(){const a=db.attempts.slice(-10);if(!a.length)return {accuracy:0,avgSeconds:Infinity,n:0};return {accuracy:a.filter(x=>x.correct).length/a.length,avgSeconds:a.reduce((s,x)=>s+(Number(x.seconds)||45),0)/a.length,n:a.length}}
function adaptiveLevel(){const p=recentPerformance();if(p.n<5)return {label:"Calibration",detail:"The plan will adapt after at least five recorded answers.",mode:"steady"};if(p.accuracy>=.85&&p.avgSeconds<=35)return {label:"Accelerated",detail:"Strong accuracy at a quick pace: the next plan prioritises harder topics and mixed questions.",mode:"harder"};if(p.accuracy<.60||p.avgSeconds>100)return {label:"Supported",detail:"Recent results suggest the pace is too demanding: revisit prerequisites, use smaller steps and practise untimed first.",mode:"support"};return {label:"Steady",detail:"Your pace is reasonable: continue the current sequence and use targeted review for missed questions.",mode:"steady"}}
function nextTopicRecommendation(){const level=adaptiveLevel(),order=dynamicTopicOrder();let candidate=order.find(t=>!topicMastery(t.name));return {level,candidate:candidate||null};}
function dynamicTopicOrder(){const mode=adaptiveLevel().mode;const difficulty=t=>/hard/i.test(t.difficulty)?3:/medium/i.test(t.difficulty)?2:1; if(mode==="harder")return [...topics].sort((a,b)=>difficulty(b)-difficulty(a)||a.hours-b.hours);if(mode==="support")return [...topics].sort((a,b)=>difficulty(a)-difficulty(b)||a.hours-b.hours);return [...topics]}
function topicGateMessage(name){const order=dynamicTopicOrder(),idx=order.findIndex(t=>t.name===name);if(idx<=0)return null;const previous=order[idx-1];if(topicMastery(previous.name))return null;return previous;}
function topicDetail(name){
 let blocked=topicGateMessage(name);if(blocked){const n=topicAttempts(blocked.name).length;const need=Math.max(0,3-n);const msg=`Before moving forward, let's make sure ${blocked.name} is solid. You have not yet met the mastery check (at least 2 correct out of your last 3 attempts, with the latest answer correct). Try the concept again, read the explanation, and retry. This is a learning guardrail, not a penalty.`;db.chat.push({role:"bot",text:msg});save();renderPage("AI Study Guide");toast("Learning paused: prerequisite needs reinforcement.");return;}

 let t=topics.find(x=>x.name===name);if(!t)return;

 <div class="section-title"><div><h2>Knowledge check</h2><p>Answer without notes. Your response time and correctness help adapt your learning path.</p></div></div><section class="page-card"><b>${q.q}</b><div id="questionOptions">${q.o.map((o,i)=>`<button class="quiz-option" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div id="questionFeedback"></div><button class="btn alt" id="retryQuestion" style="display:none;margin-top:10px">Try again without notes</button><p class="footnote">Mastery requires at least 3 attempts, 2 correct in the last 3, and a correct latest answer. One correct response alone does not unlock the next topic.</p></section>
 <div class="section-title"><div><h2>Apply it beyond GATE</h2><p>Turn theory into a practical skill.</p></div></div><section class="page-card"><p>${t.use}</p><p>Mini-project idea: write a short explanation or implementation related to this topic, add one test case, and document the complexity or trade-off. Use the Code Lab for programming-oriented exercises.</p><button class="btn" data-go="Code Lab">Open Code Lab</button> <button class="btn alt" data-go="Question Bank">More questions</button></section>`);
 $("#completeTopic").onclick=()=>{if(!topicMastery(name)){toast("Not mastered yet. Attempt the knowledge check at least 3 times and get 2 of the last 3 correct, with the latest correct.");return}if(!db.completed.includes(name))db.completed.push(name);save();topicDetail(name);toast("Mastery confirmed; topic marked complete.")};
 let questionStarted=Date.now();
 $$("#questionOptions button").forEach(b=>b.onclick=()=>{if($("#questionFeedback").dataset.answered)return;let correct=Number(b.dataset.answer)===q.a,seconds=Math.max(1,Math.round((Date.now()-questionStarted)/1000));b.classList.add(correct?"correct":"wrong");if(!correct)$(`[data-answer="${q.a}"]`).classList.add("correct");$("#questionFeedback").dataset.answered="1";let history=topicAttempts(name);let projected=[...history,{correct,seconds}].slice(-3),passed=projected.filter(x=>x.correct).length;let coach=correct?(seconds<=35?"Good recall. As accuracy and speed improve, the plan may move you toward harder mixed questions.":"Correct. Now work on retrieving the reasoning more efficiently."):("It looks like this concept may not be secure yet. "+q.why+" Try explaining the idea in your own words, then attempt again without notes.");$("#questionFeedback").innerHTML=`<div class="notice" style="margin-top:10px"><b>${correct?"Correct!":"Pause and rebuild the idea."}</b> ${q.why}<p>${coach}</p><p><b>Current evidence:</b> ${passed}/3 correct in the recent-attempt window; response time ${seconds}s.</p><p>${topicMastery(name)?"Mastery check passed. You may continue to the next topic.":"Keep practising: the next topic remains locked until the mastery check is met."}</p></div>`;db.attempts.push({topic:name,correct,seconds,date:new Date().toISOString()});if(!correct){db.errors.push({id:Date.now(),topic:name,question:q.q,chosen:q.o[Number(b.dataset.answer)],correctAnswer:q.o[q.a],explanation:q.why,date:new Date().toISOString(),resolved:false});}save();$("#retryQuestion").style.display="inline-flex";});
 $("#retryQuestion").onclick=()=>topicDetail(name);
}

function analyticsPage(){
 let completion=topics.filter(t=>db.completed.includes(t.name)).length/topics.length*100, acc=db.attempts.length?db.attempts.filter(x=>x.correct).length/db.attempts.length*100:0, score=estimatedScore();
 let p=calcPlan(), days=Math.max(1,p.days), elapsed=Math.max(0,(new Date()-new Date("2026-10-16T00:00:00"))/86400000);
 return pageShell("Analytics & score",`<div class="grid four"><div class="page-card"><small>Topic completion</small><h2>${Math.round(completion)}%</h2><div class="progress-wrap"><span style="width:${completion}%"></span></div></div><div class="page-card"><small>Question accuracy</small><h2>${Math.round(acc)}%</h2><div class="progress-wrap"><span style="width:${acc}%"></span></div></div><div class="page-card"><small>Study hours</small><h2>${Number(db.hours).toFixed(1)}</h2><div class="progress-wrap"><span style="width:${Math.min(100,db.hours/400*100)}%"></span></div></div><div class="page-card"><small>Readiness index</small><h2>${score}/100</h2><div class="progress-wrap"><span style="width:${score}%"></span></div></div></div>
 <div class="grid page-grid" style="margin-top:14px"><section class="page-card"><h3>Activity index vs your target</h3><p>Your personal target: <b>${db.settings.targetScore}/100</b>. Current index: <b>${score}/100</b>.</p><div class="progress-wrap"><span style="width:${Math.min(100,score)}%"></span></div><p class="footnote">Activity formula: 40% topic completion + 25% recorded accuracy + 20% practice volume + 15% logged hours. This rewards recorded activity and is not a validated mastery score, GATE marks prediction or percentile model. Use timed mock marks and delayed retests as stronger evidence.</p><p>${score>=db.settings.targetScore?"You have reached your personal readiness index target. Continue full-length mocks and verified PYQs.":"Next best actions: complete a topic, attempt a quiz, log real study hours, and review mistakes."}</p></section><section class="page-card"><h3>Actual GATE score vs expected score</h3><p>GATE performance cannot be reliably inferred from a simple dashboard index. For a meaningful estimate, record timed mock-test marks and compare them to the official paper pattern.</p><div class="form"><input id="mockName" placeholder="Mock / sectional test"><input id="mockScore" type="number" min="0" max="100" placeholder="Score / 100"><button class="btn" id="addMock">Record test</button></div><div class="list">${(db.mocks||[]).map(m=>`<div class="item"><div class="item-main"><b>${esc(m.name)}</b><small>${fmt(new Date(m.date))}</small></div><b>${m.score}/100</b></div>`).join("")||"<p class='footnote'>No mock scores recorded yet.</p>"}</div></section></div>
 <div class="section-title"><div><h2>Progress chart</h2><p>Visual summary of your current state.</p></div></div><section class="page-card"><canvas id="scoreChart" class="chart" aria-label="Preparation metrics chart"></canvas></section>`);
}
function drawChart(){
 const c=$("#scoreChart");if(!c)return;const ctx=c.getContext("2d"),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);
 const vals=[topics.filter(t=>db.completed.includes(t.name)).length/topics.length*100,db.attempts.length?db.attempts.filter(a=>a.correct).length/db.attempts.length*100:0,Math.min(100,db.attempts.length/120*100),Math.min(100,db.hours/400*100),estimatedScore()];
 const labels=["Topics","Accuracy","Practice volume","Study hours","Readiness"];let base=h-30, top=15, chartH=base-top, gap=w/labels.length, bw=Math.min(48,gap*.48);
 ctx.font="11px system-ui";vals.forEach((v,i)=>{let x=gap*i+gap/2-bw/2, bh=chartH*v/100;ctx.fillStyle="#e9eff8";ctx.fillRect(x,top,bw,chartH);ctx.fillStyle=["#286be5","#12ae8e","#ed9a3b","#8a5cf6","#e95782"][i];ctx.fillRect(x,base-bh,bw,bh);ctx.fillStyle="#566982";ctx.textAlign="center";ctx.fillText(Math.round(v)+"%",x+bw/2,Math.max(11,base-bh-6));ctx.fillText(labels[i],x+bw/2,h-8)});
}

 }
 if(name==="Code Lab"){
  const examples={javascript:"// JavaScript runs directly in this page.\nconst values = [3, 8, 1, 6, 4];\nconsole.log('Sorted:', [...values].sort((a,b) => a-b));\nconsole.log('Max:', Math.max(...values));",python:"# Python runs via Pyodide (downloads runtime on first run)\nvalues = [3, 8, 1, 6, 4]\nprint('Sorted:', sorted(values))\nprint('Max:', max(values))",c:"#include <stdio.h>\nint main(void) { int a[]={3,8,1,6,4}; int max=a[0]; for(int i=1;i<5;i++) if(a[i]>max) max=a[i]; printf(\"Max: %d\\n\",max); return 0; }",cpp:"#include <iostream>\n#include <vector>\n#include <algorithm>\nint main(){std::vector<int> v{3,8,1,6,4};std::sort(v.begin(),v.end());for(int x:v)std::cout<<x<<' ';}",java:"import java.util.Arrays;\npublic class Main { public static void main(String[] args) { int[] a={3,8,1,6,4}; Arrays.sort(a); System.out.println(Arrays.toString(a)); } }",typescript:"const values: number[] = [3,8,1,6,4];\nconsole.log([...values].sort((a,b)=>a-b));",sql:"SELECT department, COUNT(*) AS people\nFROM employees\nGROUP BY department\nORDER BY people DESC;"};
  $("#codeLang").onchange=()=>{db.codeLang=$("#codeLang").value;$("#codeEditor").value=examples[db.codeLang];db.code=undefined;save();renderPage(name)};
  $("#resetCode").onclick=()=>{$("#codeEditor").value=examples[$("#codeLang").value];$("#codeOutput").textContent="Output appears here…"};
  $("#codeEditor").addEventListener("input",()=>{db.code=$("#codeEditor").value;db.codeLang=$("#codeLang").value;localStorage.setItem("gateskill_single_v1",JSON.stringify(db))});
  $("#runCode").onclick=runCode;
 }
 if(name==="AI Study Guide"){
  const send=async(promptText)=>{let inp=$("#chatInput"),text=promptText||inp.value.trim();if(!text)return;db.chat.push({role:"user",text});let reply=chatReply(text);db.chat.push({role:"bot",text:reply});save();renderPage(name);let log=$("#chatLog");log.scrollTop=log.scrollHeight};
  $("#sendChat")?.addEventListener("click",()=>send());$("#chatInput")?.addEventListener("keydown",e=>{if(e.key==="Enter")send()});$$("[data-chat-prompt]").forEach(b=>b.onclick=()=>send(b.dataset.chatPrompt));
 }
}
function download(content,name,type){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function chatReply(text){
 let q=text.toLowerCase(),match=topics.find(t=>q.includes(t.name.toLowerCase())||t.name.toLowerCase().split(" ").some(w=>w.length>4&&q.includes(w)));
 if(q.includes("week")||q.includes("plan")){let p=calcPlan();return `Your syllabus-first-pass target is ${fmt(p.target)} (${p.days} days from today). Start with ${db.settings.weeklyHours} hours/week, then check the calculated workload. Suggested week: 3 sessions learning concepts, 2 sessions solving questions, 1 session revision/error log, and 1 lighter catch-up or career project session. Adjust the hours to fit your actual schedule; the app's subject hour estimates are planning aids, not guarantees.`}
 if(q.includes("revise")||q.includes("memory")||q.includes("forget"))return "Use spaced retrieval: after studying, close the notes and reconstruct the idea. Revisit after 1 day, 1 week and 1 month. Mix: (1) one-sentence explanation, (2) formula/diagram from memory, (3) 3–10 questions, (4) error log, (5) a practical example. If you miss a question, schedule it sooner instead of rereading the whole chapter.";
 if(q.includes("career")||q.includes("job")||q.includes("software")||q.includes("data"))return "Connect each concept to evidence: DSA → a tested implementation and complexity note; DBMS → SQL queries/schema/transactions; networks → a small HTTP client/server; OS → concurrency or process experiments; maths → a small data analysis. Keep Git history, README, tests and a short demo. For software roles, pair GATE study with regular coding and one finished project at a time.";
 if(q.includes("stuck")||q.includes("failed")||q.includes("can't understand")||q.includes("cannot understand")||q.includes("falling behind")||q.includes("too hard")){const weak=db.attempts.slice().reverse().find(a=>!a.correct);const level=adaptiveLevel();return `${level.label} mode: ${level.detail} ${weak?`Your latest incorrect answer was in ${weak.topic}. Return to that topic, read the explanation, explain it without notes, then retry. The path will not unlock the next sequential topic until the mastery check is met.`:"Start with one topic and answer its knowledge check; I will use your recorded correctness and response time to suggest the pace."} If the explanation is still unclear, open the topic prerequisites and use its video/resource link before trying again.`}
 if(q.includes("weak")||q.includes("score")||q.includes("mock"))return `Your activity readiness index is ${estimatedScore()}/100; it is not a GATE score prediction. Adaptive path mode: ${adaptiveLevel().label}. ${adaptiveLevel().detail} Review the Error Notebook and compare actual timed mock marks for exam readiness.`;
 if(match)return `${match.name}: ${match.concept}\n\nPrerequisites: ${match.prereq}.\nRemember it: ${match.memory}\nWhy it matters beyond GATE: ${match.use}\nPriority: ${match.priority}; difficulty: ${match.difficulty}; suggested study effort: ${match.hours} hours. These are planning estimates, not guaranteed marks. Open Concepts & Notes for the topic's knowledge check and resources.`;
 if(q.includes("hello")||q.includes("hi "))return "Hello! I can help you choose a topic, plan the week, explain a listed concept, suggest revision tactics, or connect GATE learning to software/data work. Try asking: “Explain DBMS” or “Plan my study week.”";
 return "I can help with study planning, revision strategy, career connections, and the topic notes built into this page. Try naming a topic such as Discrete Mathematics, Algorithms, Operating Systems, DBMS or Computer Networks. For detailed open-ended tutoring, connect a real language model through a secure backend; this local helper does not call an AI service.";
}
async function runCode(){
 let lang=$("#codeLang").value,code=$("#codeEditor").value,out=$("#codeOutput"),status=$("#runStatus");out.textContent="Running…";status.textContent="Running";
 try{
  if(lang==="javascript"){let logs=[];const safeConsole={log:(...x)=>logs.push(x.map(v=>typeof v==="object"?JSON.stringify(v):String(v)).join(" ")),warn:(...x)=>logs.push(x.join(" ")),error:(...x)=>logs.push(x.join(" "))};let fn=new Function("console",`"use strict";\n${code}`);fn(safeConsole);out.textContent=logs.join("\n")||"Code ran successfully (no console output).";status.textContent="Complete";return}
  if(lang==="python"){
   if(!window.loadPyodide){await new Promise((resolve,reject)=>{let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";s.onload=resolve;s.onerror=()=>reject(Error("Could not load Pyodide runtime. Check network access."));document.head.appendChild(s)});}
   window.pyodideInstance ||= await loadPyodide();let captured="";window.pyodideInstance.setStdout({batched:s=>captured+=s+"\n"});await window.pyodideInstance.runPythonAsync(code);out.textContent=captured||"Python completed (no output).";status.textContent="Complete";return;
  }
  if(lang==="sql"){out.textContent="This is an editor-only SQL sample. For live SQL practice, open https://sqlbolt.com/ or connect a database engine.";status.textContent="Display only";return}
  const runtime={c:"c",cpp:"cpp",java:"java",typescript:"typescript"}[lang];
  if(!runtime){out.textContent="Unsupported language.";status.textContent="Stopped";return}
  const response=await fetch("https://emkc.org/api/v2/piston/execute",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:runtime,version:"*",files:[{name:lang==="java"?"Main.java":lang==="c"?"main.c":lang==="cpp"?"main.cpp":"main.ts",content:code}]})});
  if(!response.ok)throw Error("External compiler service returned HTTP "+response.status);
  const result=await response.json();out.textContent=[result.compile?.output,result.run?.output,result.compile?.stderr,result.run?.stderr].filter(Boolean).join("\n")||"No output.";status.textContent=result.run?.code===0?"Complete":"Finished with errors";
 }catch(e){out.textContent="Could not run this code.\n"+e.message+"\n\nCheck your connection, or use the external online compiler links. The public API/runtime may be unavailable or rate-limited.";status.textContent="Error"}
}
function bindGlobal(){
 $("#nav").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b){currentPage=b.dataset.page;renderPage(currentPage)}});
 $("#hamb").onclick=()=>$("#sidebar").classList.toggle("open");
 $("#jumpPlan").onclick=()=>{currentPage="Study Planner";renderPage(currentPage)};
 $("#search").addEventListener("keydown",e=>{if(e.key!=="Enter")return;let q=e.target.value.trim();if(!q)return;currentPage="Concept Library";renderPage(currentPage,q);});
}
function init(){bindGlobal();renderPage("Home");}
init();
